# Full Kappa pipeline:  producer -> Kafka -> consumer (detect + explain) -> TimescaleDB -> API / dashboard
#   cp .env.example .env && docker compose up --build
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  trainer:            # one-off: generate data, train + evaluate, write artifacts, create schema
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: sh -c "python -m confluence.evaluation.run && python -c 'from confluence.storage import db; db.init_schema()'"
    volumes: [artifacts:/app/artifacts, reports:/app/reports]
    depends_on: {timescaledb: {condition: service_healthy}}

  consumer:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: python -m confluence.ingestion.consumer
    volumes: [artifacts:/app/artifacts, reports:/app/reports]
    depends_on:
      trainer: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    restart: unless-stopped

  producer:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: sh -c "sleep 20 && python -m confluence.ingestion.producer --loop"
    depends_on:
      consumer: {condition: service_started}
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: uvicorn confluence.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: [artifacts:/app/artifacts, reports:/app/reports]
    depends_on: {trainer: {condition: service_completed_successfully}}

  dashboard:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: [artifacts:/app/artifacts, reports:/app/reports]
    depends_on: {trainer: {condition: service_completed_successfully}}

  backup:
    image: timescale/timescaledb:latest-pg16
    env_file: .env
    entrypoint: ["sh", "/ops/backup.sh", "--loop"]
    volumes: ["./ops/backup:/ops", "backups:/backups"]
    depends_on: {timescaledb: {condition: service_healthy}}

volumes: {pgdata: {}, artifacts: {}, reports: {}, backups: {}}
