<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Confluence dashboard — tools and technology stack</title>
  <desc>Diagram of the tools implemented in the Confluence Visualisation Layer prototype, and the dissertation's target platform layers that still need to be wired up.</desc>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <!-- Brand mark -->
  <g transform="translate(40,20)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#0c7a82"/>
    <path d="M5 20 L11 12 L15 17 L23 8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="23" cy="8" r="2.1" fill="#ffffff"/>
  </g>
  <text x="80" y="40" font-size="24" font-weight="700" fill="#16222b">Confluence — Tools &amp; Technology Stack</text>
  <text x="40" y="70" font-size="13" fill="#5b6b7a">What is implemented in this Visualisation Layer prototype, and the platform layers it is designed to sit on top of.</text>

  <!-- Section 1 -->
  <text x="40" y="112" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#0c7a82">IMPLEMENTED IN THIS REPOSITORY</text>
  <line x1="40" y1="121" x2="1160" y2="121" stroke="#e2e8ee" stroke-width="1"/>

  <!-- Card template: x, y=136, w=204, h=190 -->
  <!-- Card 1: Structure & Styling -->
  <g transform="translate(40,136)">
    <rect x="0" y="0" width="204" height="190" rx="10" fill="#fbfcfd" stroke="#dde4ea" stroke-width="1"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="#0c7a82"/>
    <g transform="translate(16,16)" stroke="#0c7a82" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4 L3 10 L7 16"/>
      <path d="M13 4 L17 10 L13 16"/>
    </g>
    <text x="16" y="52" font-size="13" font-weight="700" fill="#16222b">Structure &amp;</text>
    <text x="16" y="68" font-size="13" font-weight="700" fill="#16222b">Styling</text>
    <line x1="16" y1="82" x2="188" y2="82" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="20" cy="106" r="2.5" fill="#0c7a82"/>
    <text x="28" y="110" font-size="11.5" fill="#4a5a68">HTML5</text>
    <circle cx="20" cy="128" r="2.5" fill="#0c7a82"/>
    <text x="28" y="132" font-size="11.5" fill="#4a5a68">CSS3 — Grid, Flexbox, vars</text>
    <circle cx="20" cy="150" r="2.5" fill="#0c7a82"/>
    <text x="28" y="154" font-size="11.5" fill="#4a5a68">Vanilla JS (ES2020+)</text>
  </g>

  <!-- Card 2: Data Visualisation -->
  <g transform="translate(268,136)">
    <rect x="0" y="0" width="204" height="190" rx="10" fill="#fbfcfd" stroke="#dde4ea" stroke-width="1"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="#0c7a82"/>
    <g transform="translate(16,16)" stroke="#0c7a82" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 17 V11"/>
      <path d="M10 17 V6"/>
      <path d="M16 17 V13"/>
    </g>
    <text x="16" y="52" font-size="13" font-weight="700" fill="#16222b">Data</text>
    <text x="16" y="68" font-size="13" font-weight="700" fill="#16222b">Visualisation</text>
    <line x1="16" y1="82" x2="188" y2="82" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="20" cy="106" r="2.5" fill="#0c7a82"/>
    <text x="28" y="110" font-size="11.5" fill="#4a5a68">Chart.js v4</text>
    <circle cx="20" cy="128" r="2.5" fill="#0c7a82"/>
    <text x="28" y="132" font-size="11.5" fill="#4a5a68">chartjs-plugin-</text>
    <text x="28" y="146" font-size="11.5" fill="#4a5a68">annotation</text>
  </g>

  <!-- Card 3: Typography -->
  <g transform="translate(496,136)">
    <rect x="0" y="0" width="204" height="190" rx="10" fill="#fbfcfd" stroke="#dde4ea" stroke-width="1"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="#0c7a82"/>
    <text x="16" y="33" font-size="15" font-weight="700" fill="#0c7a82" font-style="italic">Aa</text>
    <text x="16" y="52" font-size="13" font-weight="700" fill="#16222b">Typography</text>
    <line x1="16" y1="82" x2="188" y2="82" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="20" cy="106" r="2.5" fill="#0c7a82"/>
    <text x="28" y="110" font-size="11.5" fill="#4a5a68">Fontshare: Cabinet Grotesk</text>
    <circle cx="20" cy="128" r="2.5" fill="#0c7a82"/>
    <text x="28" y="132" font-size="11.5" fill="#4a5a68">Fontshare: Satoshi</text>
    <circle cx="20" cy="150" r="2.5" fill="#0c7a82"/>
    <text x="28" y="154" font-size="11.5" fill="#4a5a68">Google Fonts: JetBrains Mono</text>
  </g>

  <!-- Card 4: Dev & QA -->
  <g transform="translate(724,136)">
    <rect x="0" y="0" width="204" height="190" rx="10" fill="#fbfcfd" stroke="#dde4ea" stroke-width="1"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="#0c7a82"/>
    <g transform="translate(16,16)" stroke="#0c7a82" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="8.5"/>
      <path d="M5.5 9.2 L8 12 L13 5.5"/>
    </g>
    <text x="16" y="52" font-size="13" font-weight="700" fill="#16222b">Dev &amp; QA</text>
    <line x1="16" y1="82" x2="188" y2="82" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="20" cy="106" r="2.5" fill="#0c7a82"/>
    <text x="28" y="110" font-size="11.5" fill="#4a5a68">Git</text>
    <circle cx="20" cy="128" r="2.5" fill="#0c7a82"/>
    <text x="28" y="132" font-size="11.5" fill="#4a5a68">Playwright (visual QA)</text>
  </g>

  <!-- Card 5: Version Control & Hosting -->
  <g transform="translate(952,136)">
    <rect x="0" y="0" width="204" height="190" rx="10" fill="#fbfcfd" stroke="#dde4ea" stroke-width="1"/>
    <rect x="0" y="0" width="204" height="4" rx="2" fill="#0c7a82"/>
    <g transform="translate(16,16)" stroke="#0c7a82" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="5" r="2.4"/>
      <circle cx="6" cy="15" r="2.4"/>
      <circle cx="15" cy="9" r="2.4"/>
      <path d="M6 7.4 V12.6"/>
      <path d="M8.4 9 Q12.6 9 12.6 9"/>
    </g>
    <text x="16" y="52" font-size="13" font-weight="700" fill="#16222b">Version Control</text>
    <text x="16" y="68" font-size="13" font-weight="700" fill="#16222b">&amp; Hosting</text>
    <line x1="16" y1="82" x2="188" y2="82" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="20" cy="106" r="2.5" fill="#0c7a82"/>
    <text x="28" y="110" font-size="11.5" fill="#4a5a68">GitHub (repository)</text>
    <circle cx="20" cy="128" r="2.5" fill="#0c7a82"/>
    <text x="28" y="132" font-size="11.5" fill="#4a5a68">GitHub Pages (hosting)</text>
  </g>

  <!-- Connector: bottom section feeds the visualisation layer -->
  <line x1="600" y1="398" x2="600" y2="326" stroke="#98a6b3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="452" y="336" width="296" height="22" rx="11" fill="#ffffff" stroke="#e2e8ee" stroke-width="1"/>
  <text x="600" y="351" font-size="10.5" fill="#5b6b7a" text-anchor="middle">planned integration: feeds live data to this dashboard</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#98a6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Section 2 -->
  <text x="40" y="388" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#8a97a3">TARGET PLATFORM ARCHITECTURE — PER DISSERTATION PROPOSAL (NOT YET WIRED)</text>
  <line x1="40" y1="397" x2="1160" y2="397" stroke="#e2e8ee" stroke-width="1"/>

  <!-- 4 dashed boxes, centered, w=204 h=130, gap=24 -->
  <g transform="translate(156,412)">
    <rect x="0" y="0" width="204" height="130" rx="10" fill="#f7f8fa" stroke="#b7c1cb" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="16" y="30" font-size="12.5" font-weight="700" fill="#3c4a56">01 · Data Sources</text>
    <text x="16" y="54" font-size="11" fill="#6b7885">Electricity / gas / water</text>
    <text x="16" y="70" font-size="11" fill="#6b7885">smart-meter streams</text>
    <text x="16" y="94" font-size="10.5" fill="#8a97a3">SGCC-style benchmark +</text>
    <text x="16" y="110" font-size="10.5" fill="#8a97a3">simulated streams</text>
  </g>
  <g transform="translate(384,412)">
    <rect x="0" y="0" width="204" height="130" rx="10" fill="#f7f8fa" stroke="#b7c1cb" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="16" y="30" font-size="12.5" font-weight="700" fill="#3c4a56">02 · Ingestion Layer</text>
    <text x="16" y="54" font-size="11" fill="#6b7885">Apache Kafka</text>
    <text x="16" y="78" font-size="10.5" fill="#8a97a3">Streaming validation,</text>
    <text x="16" y="94" font-size="10.5" fill="#8a97a3">cleansing &amp; feature</text>
    <text x="16" y="110" font-size="10.5" fill="#8a97a3">extraction</text>
  </g>
  <g transform="translate(612,412)">
    <rect x="0" y="0" width="204" height="130" rx="10" fill="#f7f8fa" stroke="#b7c1cb" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="16" y="30" font-size="12.5" font-weight="700" fill="#3c4a56">03 · Storage Layer</text>
    <text x="16" y="54" font-size="11" fill="#6b7885">TimescaleDB / PostgreSQL</text>
    <text x="16" y="78" font-size="10.5" fill="#8a97a3">Partitioned time-series</text>
    <text x="16" y="94" font-size="10.5" fill="#8a97a3">for fast dashboard</text>
    <text x="16" y="110" font-size="10.5" fill="#8a97a3">queries</text>
  </g>
  <g transform="translate(840,412)">
    <rect x="0" y="0" width="204" height="130" rx="10" fill="#f7f8fa" stroke="#b7c1cb" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="16" y="30" font-size="12.5" font-weight="700" fill="#3c4a56">04 · Detection Layer</text>
    <text x="16" y="54" font-size="11" fill="#6b7885">Z-score · Isolation Forest</text>
    <text x="16" y="70" font-size="11" fill="#6b7885">LSTM Autoencoder</text>
    <text x="16" y="94" font-size="10.5" fill="#8a97a3">Explainability via</text>
    <text x="16" y="110" font-size="10.5" fill="#8a97a3">SHAP / LIME</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,572)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#0c7a82"/>
    <text x="24" y="12.5" font-size="11.5" fill="#4a5a68">Implemented in this repository</text>
    <rect x="290" y="0" width="16" height="16" rx="4" fill="#f7f8fa" stroke="#b7c1cb" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="314" y="12.5" font-size="11.5" fill="#4a5a68">Target architecture — not yet wired</text>
  </g>
</svg>
